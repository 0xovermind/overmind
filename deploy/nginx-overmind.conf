server {
    listen 80 default_server;
    listen [::]:80 default_server;
    server_name _;

    root /var/www/overmind;
    index index.html;

    location / {
        try_files $uri /index.html;
    }

    location /assets/ {
        expires 30d;
        add_header Cache-Control "public, immutable";
    }

    # Demo chain, through the method allow-list gate (deploy/rpc-proxy.mjs).
    location = /rpc {
        limit_req zone=overmind_rpc burst=80 nodelay;
        client_max_body_size 256k;
        proxy_pass http://127.0.0.1:8546;
        proxy_http_version 1.1;
        proxy_set_header Host $host;
    }
}
